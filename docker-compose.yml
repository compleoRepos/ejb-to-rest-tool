# ═══════════════════════════════════════════════════════════════
# Compleo EJB Client Modernizer — Docker Compose v7.9
# Services : compleo + postgres:16-alpine + minio + ollama + chromadb
# Usage : docker-compose up -d
# ═══════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── Application Compleo ────────────────────────────────────
  compleo:
    build:
      context: .
      dockerfile: docker/Dockerfile.onprem
    container_name: compleo-app
    restart: unless-stopped
    ports:
      - "${COMPLEO_PORT:-8080}:5000"
    environment:
      - NODE_ENV=production
      - COMPLEO_PORT=5000
      - SESSION_SECRET=${SESSION_SECRET:-changeme_session_secret}
      - DATABASE_URL=postgresql://${DB_USER:-compleo}:${DB_PASSWORD:-compleo_db_2024}@postgres:5432/${DB_NAME:-compleo}
      - AUTH_STRATEGY=${AUTH_STRATEGY:-local}
      - LOCAL_ADMIN_USER=${LOCAL_ADMIN_USER:-admin}
      - LOCAL_ADMIN_PASSWORD=${LOCAL_ADMIN_PASSWORD:-Compleo2024!}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-compleo}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-compleo_minio_2024}
      - MINIO_BUCKET=${MINIO_BUCKET:-compleo-data}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${SESSION_SECRET:-changeme_session_secret}
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_URL=http://chromadb:8000
      - ML_MODEL=${ML_MODEL:-qwen2.5:1.5b}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - compleo-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256M
    cap_drop:
      - ALL

  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: compleo-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-compleo}
      POSTGRES_USER: ${DB_USER:-compleo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-compleo_db_2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - compleo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-compleo} -d ${DB_NAME:-compleo}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER

  # ── MinIO (stockage S3-compatible) ─────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: compleo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-compleo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-compleo_minio_2024}
    volumes:
      - minio-data:/data
    networks:
      - compleo-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER

  # ── Ollama — LLM local pour enrichissement des rapports ────
  ollama:
    image: ollama/ollama:latest
    container_name: compleo-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - compleo-net
    # GPU optionnel — décommenter si GPU NVIDIA disponible
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── ChromaDB — Vector store pour RAG ───────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: compleo-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - compleo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Volumes persistants ────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  ollama-models:
    driver: local
  chroma-data:
    driver: local

# ── Réseau ─────────────────────────────────────────────────────
networks:
  compleo-net:
    driver: bridge
