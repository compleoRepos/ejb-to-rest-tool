---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ejb-modernizer
  labels:
    app.kubernetes.io/name: ejb-modernizer
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: ejb-modernizer
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ejb-modernizer-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ejb-modernizer-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ejb-modernizer-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ejb-modernizer-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: uploads-data
              mountPath: /data/uploads
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ejb-modernizer
  labels:
    app.kubernetes.io/name: ejb-modernizer
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: backend
